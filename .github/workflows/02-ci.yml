# This is the first real CI workflow in the course.
# It verifies a change by running tests on a fresh runner.
name: 02 CI Workflow
on:
  # Run automatically when app code, tests, or this workflow file changes.
  push:
    paths:
      - "app/**"
      - "tests/**"
      - "Dockerfile"
      - "Dockerfile.arg-base"
      - ".github/workflows/02-ci.yml"
  # Also run CI on pull requests targeting main, watching the same paths.
  # This is what lets branch protection require this check before merge.
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "Dockerfile"
      - "Dockerfile.arg-base"
      - ".github/workflows/02-ci.yml"
  # Allow a safe manual run before students trigger it with a code change.
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
# env:
#   PYTHON_VERSION: "3.12"
jobs:
  run-tests:
    # The runner is the temporary machine that executes the steps below.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        # Download the repository contents onto the runner.
        uses: actions/checkout@v6
      - name: check out repo code
        run: |
          echo "Current directory: $(pwd)"
          echo "Top-level contents:"
          ls -la
          echo "App folder:"
          ls -la app || echo "No app folder found"
          echo "Tests folder:"
          ls -la tests || echo "No tests folder found"
          echo "Dockerfile present:"
          ls -la Dockerfile* || echo "No Dockerfile found"
      - name: Set up Python
        # Prepare Python on the runner. This does not change the student laptop.
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: check version of python
        run: |
          echo "Python executable: $(which python)"
          python --version
      - name: check date of runner
        run: date
      - name: Run tests
        # This is the key verification step in the CI workflow.
        run: python -m unittest discover -s tests -v

  trivy-scan:
    # Security scanning runs on its own job, in parallel with run-tests.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Trivy filesystem scan
        # Scans the repo's source files and dependency manifests
        # (e.g. requirements.txt) for known vulnerabilities.
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Build image for scanning
        # Trivy's "image" scan needs a built image to inspect,
        # so we build it locally on the runner first (no push).
        run: docker build -f Dockerfile -t ci-scan-image:${{ github.sha }} .

      - name: Trivy Dockerfile/image scan
        # Scans the built image's layers and installed packages
        # for known vulnerabilities.
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "ci-scan-image:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
